# OpenOCD configuration file for STM32L432
# This file configures OpenOCD for flashing and debugging
# Works on macOS, Linux, and Windows

# Programmer interface - ST-Link is the standard for STM32 dev boards
# If you're using a different programmer (J-Link, CMSIS-DAP), change this line
source [find interface/stlink.cfg]

# Target MCU configuration - STM32L4 family
source [find target/stm32l4x.cfg]

# Optional: Reset configuration (uncomment if needed)
# reset_config srst_only

# Optional: Adapter speed (uncomment and adjust if having connection issues)
# adapter speed 1000
